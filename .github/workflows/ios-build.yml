name: Build HGhub iOS IPA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-build.yml"
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      export_method:
        description: '导出方式；sim-only 不签名，其余需配置签名 Secrets'
        required: true
        type: choice
        default: sim-only
        options:
          - sim-only
          - debugging
          - release-testing
          - app-store-connect

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    permissions:
      contents: read

    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22 + pnpm 10
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          corepack enable
          npm install -g pnpm@10.20.0
          pnpm -v

      - name: Setup Rust with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: pnpm tauri ios init

      - name: Prepare App Store Connect API key (optional)
        run: |
          if [ -n "$APPLE_API_KEY_B64" ] && [ -n "$APPLE_API_KEY" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            printf '%s' "$APPLE_API_KEY_B64" | base64 --decode \
              > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
            echo "API key ready"
          else
            echo "No App Store Connect API key configured"
          fi

      - name: Build simulator app (always)
        run: pnpm tauri ios build --target aarch64-sim --ci

      - name: Build signed device IPA (optional)
        if: ${{ inputs.export_method != 'sim-only' }}
        run: pnpm tauri ios build --ci --export-method "${{ inputs.export_method }}"

      - name: Collect artifacts
        run: |
          mkdir -p ios-artifacts
          find src-tauri/gen/apple -type f \( -name '*.ipa' -o -name '*.app' \) -exec cp -R {} ios-artifacts/ \;
          find ios-artifacts -maxdepth 2 -type f -print

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hghub-ios-${{ github.run_number }}
          path: ios-artifacts/
          if-no-files-found: error
          retention-days: 30
